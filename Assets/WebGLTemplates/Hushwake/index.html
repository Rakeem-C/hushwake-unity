<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hushwake · Unity</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c25;color:#e2e8d9;font:16px system-ui}canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 35%,#263e43,#101c25)}h1{font-size:clamp(38px,7vw,82px);letter-spacing:.15em;color:#ebc477;margin:0 0 18px}p{max-width:600px;text-align:center;padding:0 20px;line-height:1.6}progress{width:min(400px,80vw);accent-color:#b4d6c2}#error{display:none;max-width:650px;white-space:pre-wrap;color:#ffd7b9}a{color:#ebc477}</style></head>
<body><canvas id="unity-canvas" tabindex="0" aria-label="Hushwake Unity game. Use WASD to move, E to interact, F to attack, R for your instrument and Q to change realms."></canvas>
<div id="loading"><h1>HUSHWAKE</h1><p>A thread between two worlds<br>Unity edition</p><progress id="progress" max="1" value="0"></progress><p id="status">Loading the world…</p><p id="error"></p><p>Keyboard and mouse recommended. Your journey saves in this browser.</p></div>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading'),status=document.getElementById('status');
function fail(message){loading.style.display='flex';document.getElementById('progress').style.display='none';status.textContent='The game could not start.';const error=document.getElementById('error');error.style.display='block';error.textContent=message+'\nTry a current browser with WebGL enabled, then reload.';console.error(message);}
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=()=>fail('The Unity loader did not download.');
script.onload=()=>createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message);}},value=>{document.getElementById('progress').value=value;status.textContent='Loading the world… '+Math.round(value*100)+'%';}).then(instance=>{loading.style.display='none';canvas.focus();window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});canvas.width=window.innerWidth;canvas.height=window.innerHeight;}).catch(error=>fail(String(error)));
document.body.appendChild(script);canvas.addEventListener('click',()=>canvas.focus());window.addEventListener('keydown',event=>{if(document.activeElement===canvas&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code))event.preventDefault();});
</script></body></html>
